// 2e5 888ms , offline 88ms
// (f[i], g[i]) return c[i]; (N + M - 1) all ins
TE struct fps_t<T>::conv_t {
  fps f, g, c, a, b;
  vc<fps> ff, gg;
  int p = 0;

  T operator()(T fi, T gi) {
    f.ep(fi);
    g.ep(gi);
    int k = lowbit(p + 2), w = 1 << k, s;
    if (p + 2 == w) {
      a = f;
      sh(a, w << 1);
      ntt(a, 0);
      ff.ep(bg(a), bg(a) + w);
      b = g;
      sh(b, w << 1);
      ntt(b, 0);
      gg.ep(bg(b), bg(b) + w);
      FOR(i, w << 1) a[i] *= b[i];
      s = w - 2;
      sh(c, 2 * s + 2);
    } else {
      a.assign(ed(f) - w, ed(f));
      sh(a, w << 1);
      ntt(a, 0);
      FOR(i, w << 1) a[i] *= gg[k][i];
      b.assign(ed(g) - w, ed(g));
      sh(b, w << 1);
      ntt(b, 0);
      FOR(i, w << 1) a[i] += b[i] * ff[k][i];
      s = w - 1;
    }
    ntt(a, 1);
    FOR(i, s + 1) c[p + i] += a[s + i];
    return c[p++];
  }
};
