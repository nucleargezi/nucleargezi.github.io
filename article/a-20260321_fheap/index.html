typename ke, typename val>
  requires(is_integral_v<ke>)
struct fheap {
  using uint = typename make_unsigned<ke>::type;
  static constexpr int bit = sizeof(ke) << 3;
  vc<pair<uint, val>> vs[bit + 1];
  uint ms[bit + 1];

  int s;
  uint la;

  fheap() : s(0), la(0) { fill(ms, ms + bit + 1, uint(-1)); }

  void emplace(uint k, val w) {
    ++s;
    int i = topbit(k ^ la) + 1;
    vs[i].ep(k, w);
    chmin(ms[i], k);
  }

  pair<uint, val> pop() {
    if (ms[0] == uint(-1)) {
      int i = 1;
      while (ms[i] == uint(-1)) ++i;
      la = ms[i];
      for (Z &#38;x : vs[i]) {
        int i = topbit(x.fi ^ la) + 1;
        vs[i].ep(x);
        chmin(ms[i], x.fi);
      }
      vs[i].clear();
      ms[i] = uint(-1);
    }
    --s;
    Z s = ::pop(vs[0]);
    if (vs[0].empty()) ms[0] = uint(-1);
    return s;
  }
  
  bool empty() const { return s == 0; }

  int size() const { return s; }
